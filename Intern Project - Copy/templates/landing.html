<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Photo Sharing App</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <!-- Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        html,
        body,
        #intro {
            height: 100%;
            margin: 0;
        }
        
        #intro {
            background: linear-gradient(to right, rgba(30, 30, 30, 0.6), rgba(30, 30, 30, 0.6)), url("https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1920&q=80") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .content-box {
            color: #fff;
            text-align: center;
            max-width: 700px;
            margin: auto;
        }
        
        h2 {
            font-size: 3rem;
            font-weight: 700;
        }
        
        h4 {
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }
        
        .btn-custom {
            font-size: 1.1rem;
            padding: 12px 28px;
            border-radius: 30px;
            transition: 0.3s;
        }
        
        .btn-custom:hover {
            background: #fff;
            color: #333 !important;
        }
    </style>
</head>

<body>
    <!--Mask-->
    <div id="intro" class="view">
        <div class="container content-box">
            <!-- Heading -->
            <h2 class="mb-3">Welcome to PhotoShare</h2>

            <!-- Tagline -->
            <h4 class="mb-4">Upload, organize, and share your memories in one place.</h4>

            <!-- Button -->
            <a href="/login">
                <button type="button" class="btn btn-outline-light btn-custom">
          Get Started <i class="fa fa-rocket ml-2"></i>
        </button>
            </a>
        </div>
    </div>
    <!--/.Mask-->
</body>

</html>
