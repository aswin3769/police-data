<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="/static/images/logo.png">

    <title>SignIn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #2f2f2f;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        
        .form-signin {
            background: #ffffff;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.2);
            max-width: 420px;
            width: 100%;
        }
        
        .form-signin img {
            margin-bottom: 1rem;
        }
        
        .form-signin h1 {
            font-weight: bold;
            color: #1e3c72;
        }
        
        .form-signin h4 {
            color: #444;
            font-weight: 500;
        }
        
        .form-signin h5 {
            margin-bottom: 1rem;
            font-weight: bold;
            color: #2a5298;
        }
        
        .btn-primary {
            background: #1e3c72;
            border: none;
            transition: 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #16325c;
        }
        
        .btn-outline-info {
            margin-top: 0.5rem;
            border-color: #2a5298;
            color: #2a5298;
        }
        
        .btn-outline-info:hover {
            background-color: #2a5298;
            color: white;
        }
        
        a {
            display: block;
            margin-top: 1rem;
            text-decoration: none;
            color: #1e3c72;
            font-weight: 500;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        p {
            margin-bottom: 0.5rem;
            color: #555;
        }
    </style>

    <script>
        function CopyToClipboard(id) {
            var r = document.createRange();
            r.selectNode(document.getElementById(id));
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(r);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
        }
    </script>
</head>

<body>
    <form class="form-signin text-center" method="post" action="/register2">
        {# No csrf_token needed for FastAPI #}
        <img src="/static/images/logo.png" alt="Logo" width="128" height="128" class="mx-auto d-block">

        <h1 class="h3 mb-3">Room Creation</h1>

        <h4>Your unique RoomCode</h4>
        <h5 id="sample">{{rcode}}</h5>
        <button type="button" onclick="CopyToClipboard('sample')" class="btn btn-outline-info btn-sm">Copy RoomCode</button>

        <div class="mt-4">
            <p>Set a password for your room</p>
            <label for="inputPassword" class="sr-only">Password</label>
            <input type="password" id="inputPassword" name="inputPassword" class="form-control mb-3" placeholder="Password" required>
            <input type="hidden" name="roomCode" value="{{ rcode }}">
            <button class="btn btn-lg btn-primary w-100" type="submit">Sign in</button>
        </div>

        <a href="/login">Back to Login</a>
    </form>
</body>

</html>
