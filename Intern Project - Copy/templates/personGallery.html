<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Gallery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f2f2f;
            color: #f1f1f1;
        }
        /* Sidebar */
        
        .sidebar-card {
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 1rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
            color: #fff;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
        }
        
        .list-group-item {
            background: transparent;
            border: none;
            padding: 0.6rem 0;
        }
        
        .list-group-item a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            text-align: center;
            display: block;
            border-radius: 8px;
            padding: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .list-group-item a:hover {
            background: #2575fc;
            color: #fff !important;
        }
        /* Photo Cards */
        
        .card.my-2 {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            box-shadow: 0px 8px 18px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        
        .card.my-2:hover {
            transform: translateY(-5px);
            box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.6);
        }
        
        .image-thumbnail {
            height: 200px;
            object-fit: cover;
            width: 100%;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        /* Buttons inside photo cards */
        
        .d-flex a {
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .d-flex a:first-child {
            border-color: #6a11cb;
            color: #6a11cb !important;
            background: #fff;
        }
        
        .d-flex a:first-child:hover {
            background-color: #6a11cb;
            color: #fff !important;
        }
        
        .d-flex a:last-child {
            border-color: #2575fc;
            color: #2575fc !important;
            background: #fff;
        }
        
        .d-flex a:last-child:hover {
            background-color: #2575fc;
            color: #fff !important;
        }
        /* Headings */
        
        h3 {
            text-align: center;
            color: #6a11cb;
            font-weight: bold;
            margin-top: 2rem;
        }
        /* Room info text */
        
        p strong {
            color: #ff4081;
            font-weight: 600;
        }
    </style>
</head>

<body class="m-5">

    <div class="container">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-3">
                {% if user %}
                <p>Your RoomCode:<br> <strong>{{ user.username }}</strong></p>
                <p>Your Photos:<br> <strong>{{ count }}</strong></p>
                {% endif %}

                <div class="sidebar-card">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <a href="/albumGallery"><i class="bi bi-arrow-left-circle me-2"></i> Go Back</a>
                        </li>
                        {% if person %}
                        <li class="list-group-item">
                            <a href="/download/{{ person.id }}"><i class="bi bi-download me-2"></i> Download Zip</a>
                        </li>
                        {% endif %}
                        <li class="list-group-item">
                            <a href="/logout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Photo Gallery -->
            <div class="col-md-9">
                <div class="row">
                    {% for photo in personGalleryphotos %}
                    <div class="col-md-4">
                        <div class="card my-2">
                            <img class="image-thumbnail" src="/static/images/{{ photo.image }}" alt="Photo">

                            <div class="d-flex justify-content-between m-2">
                                <a href="/finalPhoto/{{ photo.id }}" class="btn btn-outline-dark btn-sm">View</a>
                                <a href="/download_photo/{{ photo.id }}" class="btn btn-outline-dark btn-sm">Download</a>
                            </div>
                        </div>
                    </div>
                    {% else %}
                    <div class="col-12">
                        <h3>No photos available.</h3>
                    </div>
                    {% endfor %}
                </div>
            </div>

        </div>
    </div>

</body>

</html>
