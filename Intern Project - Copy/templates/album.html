<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: gray;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        .card-photo {
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
            padding: 1rem;
            background: #fff;
            text-align: center;
        }
        
        .btn-custom {
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-custom.go-back {
            border-color: #6a11cb;
            color: #6a11cb;
        }
        
        .btn-custom.go-back:hover {
            background-color: #6a11cb;
            color: #fff;
        }
        
        .btn-custom.download {
            border-color: #2575fc;
            color: #2575fc;
        }
        
        .btn-custom.download:hover {
            background-color: #2575fc;
            color: #fff;
        }
        
        img.photo-view {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            object-fit: contain;
        }
    </style>
</head>

<body class="m-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">

                <div class="card-photo">
                    <div class="d-flex justify-content-between mb-3">
                        <a href="/albumGallery" class="btn btn-outline-dark btn-custom go-back">Go Back</a>
                        <a href="/download_photo/{{ personPhoto.id }}" class="btn btn-outline-dark btn-custom download">Download</a>
                    </div>

                    <img class="photo-view" src="/static/images/{{ personPhoto.image }}" alt="Photo">
                </div>

            </div>
        </div>
    </div>
</body>

</html>
