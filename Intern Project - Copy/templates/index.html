<!-- MultipleFiles/index.html (Improved Styled Version) -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f2f2f;
            color: #f1f1f1;
        }
        
        .sidebar {
            max-width: 260px;
            padding-left: 0 !important;
            margin-left: -10px;
        }
        
        .sidebar-card {
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 1rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
            color: #fff;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
        }
        
        .room-info {
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        
        .room-info strong {
            color: #ff4081;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .form-control-file {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 6px;
            color: #ddd;
            border: none;
        }
        
        .btn-custom {
            border-radius: 25px;
            font-weight: 500;
            width: 100%;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
            border: none;
        }
        
        .btn-custom-primary {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff !important;
        }
        
        .btn-custom-primary:hover {
            opacity: 0.9;
        }
        
        .list-group-item {
            background: transparent;
            border: none;
            padding: 0.6rem 0;
        }
        
        .list-group-item a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .list-group-item a:hover {
            color: #ff4081;
        }
        
        .card.my-2 {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            box-shadow: 0px 8px 18px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        
        .card.my-2:hover {
            transform: translateY(-5px);
            box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.6);
        }
        
        .image-thumbail {
            height: 200px;
            object-fit: cover;
            width: 100%;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .card a.btn-view {
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0.6rem auto 1rem auto;
            display: block;
            text-align: center;
            width: 80%;
            border: 1px solid #6a11cb;
            color: #6a11cb !important;
            background: #fff;
            transition: all 0.3s ease;
        }
        
        .card a.btn-view:hover {
            background: #6a11cb;
            color: #fff !important;
        }
        
        .delete-btn {
            position: absolute;
            top: 7px;
            right: 7px;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        /* Loading Overlay Styles */
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            /* Dark semi-transparent background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* Ensure it's on top of everything */
            visibility: hidden;
            /* Hidden by default */
            opacity: 0;
            transition: visibility 0s, opacity 0.3s linear;
        }
        
        .loading-overlay.visible {
            visibility: visible;
            opacity: 1;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
            color: #fff;
            /* White spinner */
        }
        
        .loading-text {
            color: #fff;
            margin-left: 1rem;
            font-size: 1.2rem;
        }
    </style>
</head>

<body class="m-4">

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <span class="loading-text">Processing photos... Please wait.</span>
    </div>

    <div class="container">
        <div class="row">

            <div class="col-md-3 sidebar">
                {% if user %}
                <div class="room-info">
                    <p>Your RoomCode:<br> <strong>{{user.username}}</strong></p>
                    <p>Photos Uploaded:<br> <strong>{{count}}</strong></p>
                    <p>Users in Room:<br> <strong id="usersInRoomCount">{{users_in_room}}</strong></p> {# Placeholder for live count #}
                </div>
                {% endif %}

                <div class="sidebar-card">
                    <form method="POST" action="/" enctype="multipart/form-data">
                        <div class="form-group mb-3">
                            <label><strong>Upload Image</strong></label>
                            <input required name="images" type="file" multiple class="form-control-file">
                        </div>
                        <button type="submit" class="btn btn-custom btn-custom-primary">Submit</button>
                    </form>
                </div>

                <div class="sidebar-card">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <a href="/process" id="processButton"><i class="bi bi-magic"></i> Process</a>
                        </li>
                        <li class="list-group-item">
                            <a href="/logout" id="logoutButton"><i class="bi bi-box-arrow-right"></i> Logout</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Photo Gallery -->
            <div class="col-md-9">
                <div class="row">
                    {% for photo in photos %}
                    <div class="col-md-4">
                        <div class="card my-2">
                            <img class="image-thumbail" src="/static/images/{{photo.image}}" alt="Photo">

                            <a href="/photo/{{photo.id}}" class="btn-view">View</a>

                            <form method="POST" action="/delete/{{photo.id}}">
                                <button type="submit" class="delete-btn">
                                    <i class="bi bi-trash-fill text-danger fs-5"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                    {% else %}
                    <h3>No photos...</h3>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    // Initial last update value
    // let lastUpdate = {{ (photos|last).id if photos|length > 0 else 0 | tojson }};

    async function checkForUpdates() {
        try {
            const res = await fetch("/last_update"); // Adjust endpoint based on your server
            const data = await res.json();

            if (data.last_update > lastUpdate) {
                window.location.reload();
            }
        } catch (err) {
            console.error("Update check failed:", err);
        }
    }

    setInterval(checkForUpdates, 5000);

    document.addEventListener('DOMContentLoaded', function() {
        const processButton = document.getElementById('processButton');
        const loadingOverlay = document.getElementById('loadingOverlay');

        if (processButton && loadingOverlay) {
            processButton.addEventListener('click', function(event) {
                // Prevent default navigation immediately to show loading screen
                event.preventDefault();
                loadingOverlay.classList.add('visible');

                setTimeout(() => {
                    window.location.href = event.target.href;
                }, 100); // Small delay to ensure overlay is visible
            });
        }

        window.addEventListener('pageshow', function(event) {
            if (event.persisted) { // Check if page is loaded from cache
                loadingOverlay.classList.remove('visible');
            }
        });


        const roomCode = "{{ user.username }}";
        const usersInRoomCountElement = document.getElementById('usersInRoomCount');
        let ws;

        function connectWebSocket() {
            ws = new WebSocket(`ws://localhost:8000/ws/${roomCode}`); // Adjust port if different

            ws.onopen = function(event) {
                console.log("WebSocket connected for room:", roomCode);
            };

            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                if (message.type === "user_count_update") {
                    if (usersInRoomCountElement) {
                        usersInRoomCountElement.textContent = message.count;
                    }
                }
            };

            ws.onclose = function(event) {
                console.log("WebSocket disconnected for room:", roomCode, "Code:", event.code, "Reason:", event.reason);
                // Attempt to reconnect after a delay
                setTimeout(connectWebSocket, 5000);
            };

            ws.onerror = function(error) {
                console.error("WebSocket error:", error);
                ws.close(); // Close to trigger reconnect logic
            };
        }

        if (roomCode && usersInRoomCountElement) {
            connectWebSocket();
        }

        // Close WebSocket gracefully on logout
        const logoutButton = document.getElementById('logoutButton');
        if (logoutButton) {
            logoutButton.addEventListener('click', function(event) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.close(1000, "User logging out");
                }
            });
        }
    });
</script>

</html>
