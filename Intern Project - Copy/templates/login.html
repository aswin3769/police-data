<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="/static/images/logo.png">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #2f2f2f;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        
        .form-signin {
            background: #ffffff;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }
        
        .form-signin img {
            margin-bottom: 1rem;
        }
        
        .form-signin h1 {
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: #1e3c72;
        }
        
        .form-signin label {
            font-weight: 600;
            /* makes labels bold */
            display: block;
            text-align: left;
            margin-bottom: 0.25rem;
            color: #1e3c72;
        }
        
        .form-signin input {
            margin-bottom: 1rem;
        }
        
        .btn-primary {
            background: #1e3c72;
            border: none;
            transition: 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #16325c;
        }
        
        a {
            display: block;
            margin-top: 1rem;
            text-decoration: none;
            color: #1e3c72;
            font-weight: 500;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        .alert {
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <form class="form-signin text-center" method="post" action="/login">
        {# No csrf_token needed for FastAPI #}
        <img src="/static/images/logo.png" alt="Logo" width="128" height="128" class="mx-auto d-block">

        <h1 class="h3">Please Sign In</h1>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <label for="roomCode">Room Code</label>
        <input type="text" id="roomCode" name="roomCode" class="form-control" placeholder="Room Code" required autofocus>

        <label for="inputPassword">Password</label>
        <input type="password" id="inputPassword" name="inputPassword" class="form-control" placeholder="Password" required>

        <button class="btn btn-lg btn-primary w-100" type="submit">Sign in</button>

        <a href="/register">Register</a>
    </form>
</body>

</html>
